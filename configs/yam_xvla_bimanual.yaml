# X-VLA policy launch config for YAM bimanual.
#
# Use with the YAM-finetuned X-VLA checkpoint served via lobe:
#
#   uv run python -m lobe.serve \
#     --checkpoint ttotmoon/yam-place-vial-xvla-v0 \
#     --port 8000 --chunk-mode \
#     --gripper-binarize --gripper-dims 6 13
#
# Notes vs yam_policy_bimanual.yaml (FM):
#   • action_horizon 30: matches X-VLA's n_action_steps (see lobe configs/yam.py:YAMXVLAConfig).
#   • async_inference true: X-VLA inference (~85 ms steady-state) is well under the
#     30/30 = 1 s buffer drain, so chunk replacement happens cleanly between drains.
#   • image_size [256, 256]: X-VLA's first two camera features are 256×256; the third
#     (image3, from right_wrist_camera) is 224×224 internally, but the server's
#     interp-resize handles the down-resize. limb's ObsTransform only sends one
#     resolution, so 256 is the right choice.
#   • image_keys: keep the limb-side camera names (head_camera / left_wrist_camera /
#     right_wrist_camera). The X-VLA preprocessor on the server side renames them to
#     image / image2 / image3 via its policy_preprocessor.json rename_map. Verified
#     working with both naming conventions.
#   • Same gripper_clip [0.0, 2.4], same dataset, same trained range.

_target_: limb.envs.launch.LaunchConfig
# YAM datasets are nominally 30 fps in info.json, but the recorded trajectories
# were collected at a higher real rate. 30 Hz feels sluggish; 60 Hz plays back
# closer to the original demo pace without retraining.
hz: 60.0

sensors:
  cameras:
    head_camera:
        _target_: limb.sensors.cameras.camera.CameraNode
        camera:
            _target_: limb.sensors.cameras.realsense_camera.RealsenseCamera
            serial_number: "215122256240"
    left_wrist_camera:
        _target_: limb.sensors.cameras.camera.CameraNode
        camera:
            _target_: limb.sensors.cameras.realsense_camera.RealsenseCamera
            serial_number: "409122274017"
    right_wrist_camera:
        _target_: limb.sensors.cameras.camera.CameraNode
        camera:
            _target_: limb.sensors.cameras.realsense_camera.RealsenseCamera
            serial_number: "409122274543"

robots:
  left: ["robot_configs/yam/left.yaml"]
  right: ["robot_configs/yam/left.yaml", "robot_configs/yam/right.yaml"]

agent:
  _target_: limb.agents.policy_learning.policy_agent.YamPolicyAgent
  client:
    _target_: limb.agents.policy_learning.policy_client.WebSocketPolicyClient
    host: "0.0.0.0"     # change to GPU machine IP if remote
    port: 8000
  obs_transform:
    _target_: limb.agents.policy_learning.transforms.ObsTransform
    state_keys:
      - "left-joint_pos"
      - "left-gripper_pos"
      - "right-joint_pos"
      - "right-gripper_pos"
    image_keys:
      # X-VLA server renames these to image / image2 / image3 internally via
      # policy_preprocessor.json's rename_map (head→image, left_wrist→image2,
      # right_wrist→image3). Verified by probe.
      head_camera: "head_camera-images-rgb"
      left_wrist_camera: "left_wrist_camera-images-rgb"
      right_wrist_camera: "right_wrist_camera-images-rgb"
    image_size: [256, 256]    # X-VLA's image / image2 spec; image3 down-resized server-side
    image_format: "uint8_hwc"
    prompt: "place the vial into the stand"   # required for VLAs
  action_transform:
    _target_: limb.agents.policy_learning.transforms.ActionTransform
    arm_names: ["left", "right"]
    joints_per_arm: 7
    include_vel: false
    gripper_clip: [0.0, 2.4]   # YAM dataset action range — same as FM config
  action_horizon: 30           # X-VLA n_action_steps
  smoothing_window: 4
  # X-VLA buffer is 30/30 = 1 s at hz=30 (1.5 s when hz=60 with chunk drain interpretation);
  # inference is ~85 ms steady-state, so async chunk replacement happens between
  # drains rather than mid-drain. No jitter risk like the FM/horizon=8 case.
  async_inference: true

# recording:
#   _target_: limb.recording.episode_recorder.EpisodeRecorder
#   base_dir: "recordings"
#   recording_fps: 30
#   auto_start: true
#   ee_frame_names:
#     left: "ee_link"
#     right: "ee_link"

station_metadata:
  world_frame: "left_arm"
  extrinsics:
    right_arm_extrinsic:
      position: [0.0, -0.61, 0.0]
      rotation: [1.0, 0.0, 0.0, 0.0]
