# OpenPI policy server config (for pi0, pi0.5, pi0-FAST served via openpi/scripts/serve_policy.py).
# Default targets a local server at 8111. Change `host` if remote.
#
# 3-camera setup. Comment out cameras you don't have.

_target_: limb.envs.launch.LaunchConfig
hz: 100.0

sensors:
  cameras:
    head_camera:
        _target_: limb.sensors.cameras.camera.CameraNode
        camera:
            _target_: limb.sensors.cameras.realsense_camera.RealsenseCamera
            serial_number: "215122256240"
    left_wrist_camera:
        _target_: limb.sensors.cameras.camera.CameraNode
        camera:
            _target_: limb.sensors.cameras.realsense_camera.RealsenseCamera
            serial_number: "409122274017"
    right_wrist_camera:
        _target_: limb.sensors.cameras.camera.CameraNode
        camera:
            _target_: limb.sensors.cameras.realsense_camera.RealsenseCamera
            serial_number: "409122274543"

robots:
  left: ["robot_configs/yam/left.yaml"]
  right: ["robot_configs/yam/left.yaml", "robot_configs/yam/right.yaml"]

agent:
  _target_: limb.agents.policy_learning.policy_agent.YamPolicyAgent
  client:
    _target_: limb.agents.policy_learning.policy_client.OpenPIClient
    host: "0.0.0.0"
    port: 8111
  obs_transform:
    _target_: limb.agents.policy_learning.transforms.OpenPIObsTransform
    state_keys:
      - "left-joint_pos"
      - "left-gripper_pos"
      - "right-joint_pos"
      - "right-gripper_pos"
    # Map server-side aloha-policy camera names to limb obs keys.
    # AlohaInputs (used by all aloha-style pi0/pi0.5 finetunes) expects cam_high / cam_left_wrist / cam_right_wrist.
    image_keys:
      cam_high: "head_camera-images-rgb"
      cam_left_wrist: "left_wrist_camera-images-rgb"
      cam_right_wrist: "right_wrist_camera-images-rgb"
    image_size: [224, 224]
    prompt: "place the vial into the stand"   # required for VLAs
  action_transform:
    _target_: limb.agents.policy_learning.transforms.ActionTransform
    arm_names: ["left", "right"]
    joints_per_arm: 7
    include_vel: false
    gripper_clip: [0.0, 1.0]
  action_horizon: 50    # pi0.5 default action_horizon
  smoothing_window: 4
  async_inference: true

recording:
  _target_: limb.recording.episode_recorder.EpisodeRecorder
  base_dir: "recordings"
  recording_fps: 30
  auto_start: true
  ee_frame_names:
    left: "ee_link"
    right: "ee_link"

station_metadata:
  world_frame: "left_arm"
  extrinsics:
    right_arm_extrinsic:
      position: [0.0, -0.61, 0.0]
      rotation: [1.0, 0.0, 0.0, 0.0]
