# Generic WebSocket policy server config (for use with docs/policy_server_spec.md).
# Default targets `lobe-serve` for any LeRobot-format policy (FM, Diffusion, X-VLA, SmolVLA).
# Change `host` to your GPU machine if the server runs remotely.
#
# 3-camera setup (head + both wrists) — required for policies trained on the standard
# YAM dataset layout. Comment out cameras you don't have, but the policy will receive
# black frames in their place (X-VLA tolerates via image_mask; FM/DP do not).

_target_: limb.envs.launch.LaunchConfig
hz: 100.0

sensors:
  cameras:
    head_camera:
        _target_: limb.sensors.cameras.camera.CameraNode
        camera:
            _target_: limb.sensors.cameras.realsense_camera.RealsenseCamera
            serial_number: "215122256240"
    left_wrist_camera:
        _target_: limb.sensors.cameras.camera.CameraNode
        camera:
            _target_: limb.sensors.cameras.realsense_camera.RealsenseCamera
            serial_number: "409122274017"
    right_wrist_camera:
        _target_: limb.sensors.cameras.camera.CameraNode
        camera:
            _target_: limb.sensors.cameras.realsense_camera.RealsenseCamera
            serial_number: "409122274543"

robots:
  left: ["robot_configs/yam/left.yaml"]
  right: ["robot_configs/yam/left.yaml", "robot_configs/yam/right.yaml"]

agent:
  _target_: limb.agents.policy_learning.policy_agent.YamPolicyAgent
  client:
    _target_: limb.agents.policy_learning.policy_client.WebSocketPolicyClient
    host: "0.0.0.0"     # change to GPU machine IP if remote
    port: 8000
  obs_transform:
    _target_: limb.agents.policy_learning.transforms.ObsTransform
    state_keys:
      - "left-joint_pos"
      - "left-gripper_pos"
      - "right-joint_pos"
      - "right-gripper_pos"
    image_keys:
      # Server-side camera names — must match what the trained policy expects.
      # For YAM models trained via LOBE (configs/yam.py), keep the *_camera names.
      head_camera: "head_camera-images-rgb"
      left_wrist_camera: "left_wrist_camera-images-rgb"
      right_wrist_camera: "right_wrist_camera-images-rgb"
    image_size: [240, 320]      # native YAM training resolution (matches lobe presets)
    image_format: "uint8_hwc"
    prompt: "place the vial into the stand"   # required for VLAs; harmless for FM/DP
  action_transform:
    _target_: limb.agents.policy_learning.transforms.ActionTransform
    arm_names: ["left", "right"]
    joints_per_arm: 7
    include_vel: false
    gripper_clip: [0.0, 1.0]
  action_horizon: 8     # FM/DP default; bump to 30 for X-VLA, 50 for pi0.5
  smoothing_window: 4
  async_inference: true

recording:
  _target_: limb.recording.episode_recorder.EpisodeRecorder
  base_dir: "recordings"
  recording_fps: 30
  auto_start: true
  ee_frame_names:
    left: "ee_link"
    right: "ee_link"

station_metadata:
  world_frame: "left_arm"
  extrinsics:
    right_arm_extrinsic:
      position: [0.0, -0.61, 0.0]
      rotation: [1.0, 0.0, 0.0, 0.0]
