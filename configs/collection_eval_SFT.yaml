# pi0.5-SFT EVALUATION — STANDALONE config (record + label baseline VLA rollouts).
# Plain 2-arm policy stack; the foot pedal toggles the only two phases:
# PAUSED (robots hold, stage the scene) <-> AUTONOMOUS (the VLA drives).
#
# Serve the SFT checkpoint on :8111 first (see SubRL-VLA/README.md), then:
#   uv run limb record --config-path configs/collection_eval_SFT.yaml
#
# Per-trial flow (agent boots PAUSED — the policy never drives an unstaged scene):
#   1. Stage the vials, press SPACE   -> episode recording starts (still PAUSED)
#   2. LEFT pedal (KEY_A)             -> AUTONOMOUS: the VLA drives
#   3. LEFT pedal again               -> PAUSED: arm freezes for labeling
#   4. [S] save SUCCESS   SPACE save FAILURE   [D] discard   [Q] quit
#   5. Re-stage, SPACE for the next trial.
# Every frame carries the phase (phase.npy: paused/autonomous), so staging
# frames filter out trivially. The right pedal (KEY_B, DAgger correction) is
# ignored by this agent — there are no leader arms here.
#
# Session trigger is KEYBOARD-ONLY: the 0x3553:0xb001 pedal is owned
# exclusively by the agent's phase trigger (same conflict note as
# configs/dagger_collection.yaml).
# Success rate = num_successful / num_completed in session_metadata.

_target_: limb.envs.launch.LaunchConfig
hz: 30.0   # same as yam_pi0_bimanual.yaml (YAM datasets are 30 fps)

sensors:
  cameras:
    head_camera:
        _target_: limb.sensors.cameras.camera.CameraNode
        camera:
            _target_: limb.sensors.cameras.realsense_camera.RealsenseCamera
            serial_number: "215122256240"
    left_wrist_camera:
        _target_: limb.sensors.cameras.camera.CameraNode
        camera:
            _target_: limb.sensors.cameras.realsense_camera.RealsenseCamera
            serial_number: "409122274543"
    right_wrist_camera:
        _target_: limb.sensors.cameras.camera.CameraNode
        camera:
            _target_: limb.sensors.cameras.realsense_camera.RealsenseCamera
            serial_number: "409122274017"

robots:
  left: ["robot_configs/yam/left.yaml"]
  right: ["robot_configs/yam/left.yaml", "robot_configs/yam/right.yaml"]

agent:
  _target_: limb.agents.dagger.PedalPausePolicyAgent
  initial_phase: paused

  phase_trigger:
    _target_: limb.agents.dagger.FootPedalPhaseTrigger
    device_path: "auto"
    vendor_id: 0x3553
    product_id: 0xb001
    pause_resume_key: "KEY_A"
    correction_key: "KEY_B"   # bounced by this agent (no leaders)

  # Same shape as configs/yam_pi0_bimanual.yaml, with the prompt pinned to the
  # LITERAL pi0.5-SFT training string (user 2026-07-14) — the generic configs'
  # prompts are not the SFT lineage and understate the checkpoint.
  inner_policy:
    _target_: limb.agents.policy_learning.policy_agent.YamPolicyAgent
    client:
      _target_: limb.agents.policy_learning.policy_client.OpenPIClient
      host: "0.0.0.0"
      port: 8111
    obs_transform:
      _target_: limb.agents.policy_learning.transforms.OpenPIObsTransform
      state_keys:
        - "left-joint_pos"
        - "left-gripper_pos"
        - "right-joint_pos"
        - "right-gripper_pos"
      image_keys:
        cam_high: "head_camera-images-rgb"
        cam_left_wrist: "left_wrist_camera-images-rgb"
        cam_right_wrist: "right_wrist_camera-images-rgb"
      image_size: [224, 224]
      prompt: "pick up all vials and place them in the stand"
      adv_ind: null   # vanilla pi0.5 checkpoint — adv_ind is pistar/RECAP-only
    action_transform:
      _target_: limb.agents.policy_learning.transforms.ActionTransform
      arm_names: ["left", "right"]
      joints_per_arm: 7
      include_vel: false
      gripper_clip: [0.0, 2.4]
    action_horizon: 50      # pi0.5 default
    smoothing_window: 4
    async_inference: false  # sync — required for the reset-on-resume contract

collection:
  _target_: limb.recording.session.DataCollectionSession
  num_episodes: 30
  # Literal SFT prompt again — stored in episode metadata + session dir name.
  task_instruction: "pick up all vials and place them in the stand"
  default_success: false   # SPACE-saved episodes are labeled FAILURES; only [S] marks success
  countdown_s: 0.0         # recording starts instantly; the VLA start is the pedal's job
  trigger:
    _target_: limb.recording.trigger.KeyboardTrigger
  recorder:
    _target_: limb.recording.episode_recorder.EpisodeRecorder
    base_dir: "recordings/eval_SFT"
    recording_fps: 30
    ee_frame_names:
      left: "ee_link"
      right: "ee_link"

station_metadata:
  world_frame: "left_arm"
  extrinsics:
    right_arm_extrinsic:
      position: [0.0, -0.61, 0.0]
      rotation: [1.0, 0.0, 0.0, 0.0]
